<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persons - Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f3f6fb;--card:#fff;--line:#e3eaf5;--text:#111827;--muted:#7b8794;--blue:#0a7cf0;--red:#d93a3a;--green:#0d9b5c;--head:#eef2f7}
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif}
    body{background:var(--bg);color:var(--text);min-height:100vh;padding:30px 34px 50px}
    .wrap{max-width:1180px;margin:0 auto}

    .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px}
    .search-top{flex:1;max-width:520px}
    .search-top input{width:100%;height:54px;border:1px solid #d6e0ee;border-radius:12px;padding:0 20px;background:#fff;font-size:.9rem;color:var(--text);outline:none}
    .search-top input:focus,.tools input:focus,.tools select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,124,240,.12)}
    .user{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;white-space:nowrap}
    .user svg{width:20px;height:20px;fill:#4c2a85}.user .sep{color:#9aa5b4;font-weight:400}

    .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:.8rem;font-weight:600;margin-bottom:10px}
    .back:hover{color:var(--blue)}
    .titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:30px;flex-wrap:wrap}
    .titlebar h1{font-size:2.1rem;font-weight:800;line-height:1.15}
    .titlebar p{margin-top:8px;color:var(--muted);font-size:1.02rem}
    .btn-add{border:0;background:var(--blue);color:#fff;font-weight:700;font-size:.95rem;border-radius:11px;padding:15px 24px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(10,124,240,.25)}
    .btn-add:hover{background:#0867ca}

    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px}
    .stat small{display:block;color:var(--muted);font-size:.9rem;font-weight:500}
    .stat b{display:block;margin-top:10px;font-size:1.85rem;font-weight:800;white-space:nowrap}
    .stat .red{color:var(--red)}.stat .blue{color:var(--blue)}.stat .green{color:var(--green)}

    .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 24px 14px}
    .tools{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;justify-content:flex-end}
    .tools .grow{flex:1;min-width:220px}
    .tools input,.tools select{width:100%;height:52px;border:1px solid #d6e0ee;border-radius:12px;padding:0 16px;font-size:.9rem;background:#fff;color:var(--text);outline:none}
    .tools select{width:200px;cursor:pointer;font-weight:600}
    .btn-export{height:52px;border:1px solid #d6e0ee;background:#fff;border-radius:12px;padding:0 22px;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--text)}
    .btn-export:hover{background:#f6f9fd}

    .table-wrap{overflow-x:auto;border-radius:10px}
    table{width:100%;border-collapse:collapse;min-width:860px}
    thead th{background:var(--head);font-size:.92rem;font-weight:700;text-align:left;padding:17px 18px;border-bottom:2px solid #dde5ef;white-space:nowrap}
    tbody td{padding:22px 18px;border-bottom:1px solid #edf1f6;font-size:.95rem}
    tbody tr:hover{background:#fafcff}
    td.id{color:#4b5563;width:60px}td.name{font-weight:700}td.role{color:var(--muted)}
    td.money{font-weight:700;white-space:nowrap}
    .c-red{color:var(--red)}.c-blue{color:var(--blue)}.c-green{color:var(--green)}.c-red-neg{color:var(--red)}
    .acct{display:flex;align-items:center;gap:6px;white-space:nowrap}
    .btn-open{border:0;background:#e8f3ff;color:#2a86d6;border-radius:9px;padding:11px 16px;font-weight:600;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
    .btn-open:hover{background:#d6eaff}
    .btn-open svg{width:16px;height:16px}
    .icon-btn{border:0;background:#f1f5f9;color:#475569;border-radius:8px;width:34px;height:34px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
    .icon-btn:hover{background:#e2e8f0}.icon-btn.del:hover{background:#fee2e2;color:var(--red)}
    .icon-btn svg{width:15px;height:15px}
    .empty{text-align:center;color:var(--muted);padding:50px 10px!important;font-size:.95rem}
    .count{color:var(--muted);font-size:.78rem;padding:12px 4px 4px}

    .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
    .modal-bg.open{display:flex}
    .modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:430px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
    .modal h3{font-size:1.2rem;margin-bottom:6px}
    .modal label{display:block;font-size:.7rem;font-weight:800;color:#64748b;text-transform:uppercase;margin:16px 0 6px}
    .modal input{width:100%;height:46px;border:1px solid #cbd5e1;border-radius:10px;padding:0 14px;font-size:.92rem;outline:none}
    .modal input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,124,240,.12)}
    .modal .err{color:var(--red);font-size:.8rem;min-height:18px;margin-top:10px}
    .modal .btns{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
    .modal .btns button{border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:.88rem}
    .btn-cancel{background:#f1f5f9;color:#334155}.btn-save{background:var(--blue);color:#fff}.btn-save:disabled{opacity:.6;cursor:default}

    .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:13px 22px;border-radius:10px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){body{padding:18px 14px 40px}.topbar{flex-direction:column-reverse;align-items:stretch}.user{justify-content:flex-end}.search-top{max-width:none}.stats{grid-template-columns:1fr}.titlebar h1{font-size:1.7rem}.tools select{width:100%}.btn-add{width:100%;justify-content:center}.panel{padding:16px 12px 10px}}
  </style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="search-top"><input id="searchTop" type="search" placeholder="Search by name, ID or role..." autocomplete="off"></div>
    <div class="user">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4.5"/><path d="M3 21c0-4.4 4-7 9-7s9 2.6 9 7z"/></svg>
      <span id="userName">Essa Ali</span><span class="sep">|</span><span id="userRole">Admin</span>
    </div>
  </div>

  <a class="back" href="dashboard.html">← Back to Dashboard</a>
  <div class="titlebar">
    <div>
      <h1>Persons</h1>
      <p>Manage person accounts and the financial transactions of each person</p>
    </div>
    <button class="btn-add" onclick="openModal()">+ Add Person</button>
  </div>

  <div class="stats">
    <div class="stat"><small>Number of Persons</small><b id="stCount">0</b></div>
    <div class="stat"><small>Total Expenses</small><b class="red" id="stExp">EGP 0</b></div>
    <div class="stat"><small>Total Payments</small><b class="blue" id="stPay">EGP 0</b></div>
    <div class="stat"><small>Total Balances</small><b class="green" id="stBal">EGP 0</b></div>
  </div>

  <div class="panel">
    <div class="tools">
      <select id="roleFilter"><option value="">All Roles</option></select>
      <button class="btn-export" onclick="exportExcel()">Export Excel</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Role</th><th>Total Expenses</th><th>Total Payments</th><th>Balance</th><th>Account</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="count" id="countLine"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">Add Person</h3>
    <label>Name</label><input id="fName" maxlength="255" placeholder="Full name" autocomplete="off">
    <label>Role</label><input id="fRole" maxlength="150" placeholder="e.g. Maintenance Technician" list="roleList" autocomplete="off">
    <datalist id="roleList"></datalist>
    <div class="err" id="formErr"></div>
    <div class="btns"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" id="btnSave" onclick="savePerson()">Save</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let persons=[];
let editingId=null;

function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function egp(n){return 'EGP '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200);}

/* logged-in user badge */
(function(){
  try{
    const u=JSON.parse(localStorage.getItem('cmsUser')||'null');
    if(u&&u.username){
      document.getElementById('userName').textContent=u.username;
      const r=String(u.role||'Admin');
      document.getElementById('userRole').textContent=r.charAt(0).toUpperCase()+r.slice(1);
    }
  }catch(e){}
})();

async function loadPersons(){
  try{
    const res=await fetch('/api/persons');
    const data=await res.json();
    if(!res.ok||!data.success) throw new Error(data.message||'Failed to load persons');
    persons=data.persons||[];
  }catch(e){
    persons=[];
    document.getElementById('tbody').innerHTML='<tr><td colspan="7" class="empty">'+escapeHtml(e.message)+'</td></tr>';
    return;
  }
  fillRoles(); renderStats(); renderTable();
}

function fillRoles(){
  const sel=document.getElementById('roleFilter'); const current=sel.value;
  const roles=[...new Set(persons.map(p=>p.role))].sort((a,b)=>a.localeCompare(b));
  sel.innerHTML='<option value="">All Roles</option>'+roles.map(r=>`<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');
  sel.value=roles.includes(current)?current:'';
  document.getElementById('roleList').innerHTML=roles.map(r=>`<option value="${escapeHtml(r)}">`).join('');
}

function renderStats(){
  const exp=persons.reduce((a,p)=>a+p.total_expenses,0);
  const pay=persons.reduce((a,p)=>a+p.total_payments,0);
  document.getElementById('stCount').textContent=persons.length;
  document.getElementById('stExp').textContent=egp(exp);
  document.getElementById('stPay').textContent=egp(pay);
  document.getElementById('stBal').textContent=egp(exp-pay);
}

function filtered(){
  const q=document.getElementById('searchTop').value.trim().toLowerCase();
  const role=document.getElementById('roleFilter').value;
  return persons.filter(p=>(!role||p.role===role)&&(!q||p.name.toLowerCase().includes(q)||p.role.toLowerCase().includes(q)||String(p.id)===q||String(p.id).startsWith(q)&&/^\d+$/.test(q)));
}

const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const BIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>';

function renderTable(){
  const list=filtered(); const body=document.getElementById('tbody');
  if(!list.length){
    body.innerHTML='<tr><td colspan="7" class="empty">'+(persons.length?'No persons match your search.':'No persons yet. Click “+ Add Person” to add the first one.')+'</td></tr>';
  }else{
    body.innerHTML=list.map(p=>`<tr>
      <td class="id">${p.id}</td>
      <td class="name">${escapeHtml(p.name)}</td>
      <td class="role">${escapeHtml(p.role)}</td>
      <td class="money c-red">${egp(p.total_expenses)}</td>
      <td class="money c-blue">${egp(p.total_payments)}</td>
      <td class="money ${p.balance<0?'c-red-neg':'c-green'}">${egp(p.balance)}</td>
      <td><div class="acct"><button class="btn-open" onclick="openAccount(${p.id})">${EYE} Open Account</button><button class="icon-btn" title="Edit" onclick="openModal(${p.id})">${PEN}</button><button class="icon-btn del" title="Delete" onclick="deletePerson(${p.id})">${BIN}</button></div></td>
    </tr>`).join('');
  }
  document.getElementById('countLine').textContent=persons.length?`Showing ${list.length} of ${persons.length} persons`:'';
}

document.getElementById('searchTop').addEventListener('input',renderTable);
document.getElementById('roleFilter').addEventListener('change',renderTable);

function openAccount(id){ window.location.href='person-account.html?id='+encodeURIComponent(id); }

function openModal(id){
  editingId=id||null;
  const p=editingId?persons.find(x=>x.id===editingId):null;
  document.getElementById('modalTitle').textContent=p?'Edit Person':'Add Person';
  document.getElementById('fName').value=p?p.name:'';
  document.getElementById('fRole').value=p?p.role:'';
  document.getElementById('formErr').textContent='';
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('fName').focus();
}
function closeModal(){document.getElementById('modalBg').classList.remove('open');}

async function savePerson(){
  const name=document.getElementById('fName').value.trim();
  const role=document.getElementById('fRole').value.trim();
  const err=document.getElementById('formErr'); err.textContent='';
  if(!name||!role){err.textContent='Please enter the name and the role.';return;}
  const btn=document.getElementById('btnSave'); btn.disabled=true;
  try{
    const res=await fetch(editingId?'/api/persons/'+editingId:'/api/persons',{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,role})});
    const data=await res.json();
    if(!res.ok||!data.success){err.textContent=data.message||'Could not save the person.';return;}
    closeModal(); toast(editingId?'Person updated.':'Person added.');
    await loadPersons();
  }catch(e){err.textContent='Could not reach the server.';}
  finally{btn.disabled=false;}
}

async function deletePerson(id){
  const p=persons.find(x=>x.id===id); if(!p) return;
  if(!confirm('Delete "'+p.name+'" and all of their transactions? This cannot be undone.')) return;
  const res=await fetch('/api/persons/'+id,{method:'DELETE'});
  const data=await res.json();
  if(!res.ok||!data.success){alert(data.message||'Could not delete the person.');return;}
  toast('Person deleted.'); loadPersons();
}

/* Export to Excel: summary sheet + every transaction (date, type, amount, notes) */
async function exportExcel(){
  const list=filtered();
  if(!list.length){toast('Nothing to export.');return;}
  const btn=document.querySelector('.btn-export'); btn.disabled=true; const old=btn.textContent; btn.textContent='Exporting...';
  try{
    const res=await fetch('/api/persons/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:list.map(p=>p.id)})});
    if(!res.ok){let m='Could not export.';try{m=(await res.json()).message||m;}catch(e){} throw new Error(m);}
    const blob=await res.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='persons-'+new Date().toISOString().slice(0,10)+'.xlsx';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
    toast('Excel file downloaded.');
  }catch(e){toast(e.message);}
  finally{btn.disabled=false; btn.textContent=old;}
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter'&&document.getElementById('modalBg').classList.contains('open')&&e.target.tagName==='INPUT') savePerson();
});

/* refresh totals when coming back from an account page */
window.addEventListener('pageshow',e=>{ if(e.persisted) loadPersons(); });
loadPersons();
</script>
</body>
</html>
