<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liebherr Experts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stripe-top"></div>
  <div class="stripe-bottom"></div>

  <main class="page-layout">
    <!-- مساحة مفرغة جهة اليسار لترك نصوص الصورة الأصلية تظهر بنقاء بدون أي تداخل -->
    <div class="brand-spacer"></div>

    <!-- كارت تسجيل الدخول جهة اليمين -->
    <div class="login-wrapper">
      <div class="login-card">
      
        <form id="loginForm">
          <div class="field-wrap">
            <span class="field-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#718299" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="username" placeholder="Username or Email" required autocomplete="username">
          </div>

          <div class="field-wrap">
            <span class="field-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#718299" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="button" id="togglePass" class="btn-toggle">Show</button>
          </div>

          <button type="submit" id="submitBtn" class="btn-login">
            <span>Login</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>

          <p id="errorMsg" class="error-text"></p>
        </form>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
