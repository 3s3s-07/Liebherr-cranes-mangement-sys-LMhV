<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Crane Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: #0b1320;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* الأشرطة التزيينية بالزوايا */
    .stripe-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 140px;
      height: 10px;
      background: #f5a61d;
      clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
      z-index: 10;
    }

    .stripe-bottom {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 150px;
      height: 14px;
      background: #f5a61d;
      clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%);
      z-index: 10;
    }

    /* الهيدر الرئيسي */
    header {
      background: rgba(14, 25, 43, 0.95);
      border-bottom: 1px solid rgba(82, 108, 142, 0.35);
      padding: 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .header-subtitle {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: #f5a61d;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* البارات القابلة للنقر */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(18, 30, 51, 0.85);
      border: 1px solid rgba(82, 108, 142, 0.4);
      padding: 18px 24px;
      border-radius: 8px;
      text-decoration: none;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .nav-bar:hover {
      background: rgba(26, 43, 71, 0.95);
      border-color: #f5a61d;
      transform: translateX(4px);
    }

    .nav-bar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-bar svg.icon {
      width: 22px;
      height: 22px;
      stroke: #f5a61d;
    }

    .nav-bar svg.arrow {
      width: 18px;
      height: 18px;
      stroke: #7d93ae;
      transition: stroke 0.2s, transform 0.2s;
    }

    .nav-bar:hover svg.arrow {
      stroke: #f5a61d;
      transform: translateX(3px);
    }

    /* أقسام الكروت */
    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      border-left: 4px solid #f5a61d;
      padding-left: 12px;
      margin-top: 10px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    /* الصناديق التي تحتوي على الصور والأسماء */
    .cards-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .person-card {
      background: rgba(14, 25, 43, 0.85);
      border: 1px solid rgba(82, 108, 142, 0.35);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s, transform 0.2s;
    }

    .person-card:hover {
      border-color: rgba(245, 166, 29, 0.6);
      transform: translateY(-2px);
    }

    .avatar-wrapper {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid #f5a61d;
      overflow: hidden;
      flex-shrink: 0;
      background: #152238;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .person-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .person-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
    }

    .person-role {
      font-size: 0.75rem;
      font-weight: 600;
      color: #7d93ae;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    @media (max-width: 650px) {
      .cards-row {
        grid-template-columns: 1fr;
      }
      .header-title {
        font-size: 1.35rem;
      }
      header {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="stripe-top"></div>
  <div class="stripe-bottom"></div>

  <!-- الـ Header -->
  <header>
    <h1 class="header-title">CRANE MANAGEMENT SYSTEM</h1>
    <p class="header-subtitle">THE MOUNTAIN</p>
  </header>

  <div class="container">
    <!-- بار Cranes -->
    <a href="cranes.html" class="nav-bar">
      <div class="nav-bar-left">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 17h20M5 17v-4h4v4M9 13l3-6h8l-3 6M17 7V3h3M3 17a2 2 0 1 0 4 0 2 2 0 1 0-4 0M17 17a2 2 0 1 0 4 0 2 2 0 1 0-4 0"/>
        </svg>
        <span>Cranes</span>
      </div>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </a>

    <!-- بار Crane Summary -->
    <a href="cranes-summary.html" class="nav-bar">
      <div class="nav-bar-left">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Crane Summary</span>
      </div>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </a>

    <!-- بار Company Finance -->
    <a href="company-finance.html" class="nav-bar">
      <div class="nav-bar-left">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
          <path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path>
          <path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path>
        </svg>
        <span>Company Finance</span>
      </div>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </a>

    <!-- بار Persons -->
    <a href="persons.html" class="nav-bar">
      <div class="nav-bar-left">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path>
          <circle cx="10" cy="7" r="4"></circle>
          <path d="M21 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Persons</span>
      </div>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </a>

    <!-- قسم Founders -->
    <div class="section-title">Founders</div>
    <div class="cards-row">
      <!-- Founder 1 -->
      <div class="person-card">
        <div class="avatar-wrapper">
          <img src="aly essa.jpeg" alt="Founder 1">
        </div>
        <div class="person-info">
          <h3 class="person-name">MR/Aly Essa</h3>
          <span class="person-role">Co-Founder</span>
        </div>
      </div>

      <!-- Founder 2 -->
      <div class="person-card">
        <div class="avatar-wrapper">
          <img src="ayman.jpeg" alt="Founder 2">
        </div>
        <div class="person-info">
          <h3 class="person-name">MR/Ayman Soliman</h3>
          <span class="person-role">Co-Founder</span>
        </div>
      </div>
    </div>

    <!-- قسم Engineering Management & Engineering Team -->
    <div class="section-title">Engineering Departament</div>
    <div class="cards-row">
      <!-- Engineering Management -->
      <div class="person-card">
        <div class="avatar-wrapper">
          <img src="abda.jpeg" alt="Engineering Management">
        </div>
        <div class="person-info">
          <h3 class="person-name">Eng.Abdalla Eldemerdash</h3>
          <span class="person-role">Engineering Management</span>
        </div>
      </div>

      <!-- Engineering Team Lead -->
      <div class="person-card">
        <div class="avatar-wrapper">
          <img src="essa.jpeg" alt="Engineering Team Lead">
        </div>
        <div class="person-info">
          <h3 class="person-name">Eng.Essa Ali</h3>
          <span class="person-role">Engineering CO-Worker</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
